
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dalasisfx-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-dalasisfx-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /dalasisfx
            pathType: Prefix
            backend:
              service:
                name: dalasisfx
                port:
                  number: 80
