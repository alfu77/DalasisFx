
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost-apps-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-portfolio
                port:
                  number: 80
