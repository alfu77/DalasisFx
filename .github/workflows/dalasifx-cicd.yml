
name: DalasiFX CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "config.py"
      - "database.py"
      - "services/**"
      - "templates/**"
      - "static/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - "k8s/deployment.yaml"
      - ".github/workflows/dalasifx-cicd.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dalasifx-production
  cancel-in-progress: false

env:
  ACR_NAME: ghostacr77
  IMAGE_NAME: dalasisfx
  RESOURCE_GROUP: ghost-rg
  AKS_CLUSTER: ghost-aks77

jobs:
  test:
    name: Test DalasiFX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  build-and-deploy:
    name: Build, Push and Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set image tag
        run: |
          echo "IMAGE=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build --pull -t "$IMAGE" .

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Push image to ACR
        run: docker push "$IMAGE"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Update DalasiFX Deployment image
        run: |
          CONTAINER_NAME=$(kubectl get deployment dalasisfx \
            -o jsonpath='{.spec.template.spec.containers[0].name}')

          if [ -z "$CONTAINER_NAME" ]; then
            echo "Could not find a container in deployment dalasisfx"
            exit 1
          fi

          kubectl set image deployment/dalasisfx \
            "$CONTAINER_NAME=$IMAGE"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/dalasisfx --timeout=180s
          kubectl get deployment dalasisfx
          kubectl get pods -o wide
