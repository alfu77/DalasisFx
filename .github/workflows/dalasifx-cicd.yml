
name: DalasiFX CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "config.py"
      - "database.py"
      - "services/**"
      - "templates/**"
      - "static/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - "k8s/deployment.yaml"
      - ".github/workflows/dalasifx-cicd.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dalasifx-production
  cancel-in-progress: false

env:
  ACR_NAME: ghostacr77
  IMAGE_NAME: dalasisfx
  RESOURCE_GROUP: ghost-rg
  AKS_CLUSTER: ghost-aks77

jobs:
  test:
    name: Test DalasiFX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  build-and-deploy:
    name: Build, Push and Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_TERRAFORM_CREDENTIALS }}

      - name: Set image tag
        run: |
          echo "IMAGE=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build --pull -t "$IMAGE" .

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      - name: Push image to ACR
        run: |
          docker push "$IMAGE"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Install PyYAML
        run: python -m pip install PyYAML

      - name: Update Deployment image
        run: |
          python - <<'PY'
          import os
          import yaml

          path = "k8s/deployment.yaml"

          with open(path, encoding="utf-8") as file:
              deployment = yaml.safe_load(file)

          if deployment.get("kind") != "Deployment":
              raise SystemExit("Expected a Kubernetes Deployment manifest")

          if deployment.get("metadata", {}).get("name") != "dalasisfx":
              raise SystemExit("Unexpected Deployment name; stopping")

          containers = deployment.get("spec", {}).get(
              "template", {}
          ).get("spec", {}).get("containers", [])

          if len(containers) != 1:
              raise SystemExit(
                  "Expected exactly one container in dalasisfx Deployment"
              )

          containers[0]["image"] = os.environ["IMAGE"]

          with open(path, "w", encoding="utf-8") as file:
              yaml.safe_dump(deployment, file, sort_keys=False)
          PY

      - name: Apply Deployment
        run: |
          kubectl apply -f k8s/deployment.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/dalasisfx --timeout=180s
          kubectl get deployment dalasisfx
          kubectl get pods -o wide
